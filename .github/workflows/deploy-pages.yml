name: Deploy PSYBOSS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (no DB needed)
        run: bunx prisma generate || true
        env:
          DATABASE_URL: "file:./dummy.db"

      - name: Build static site
        run: NEXT_PUBLIC_STATIC=true bun run next build
        env:
          NEXT_PUBLIC_STATIC: "true"

      - name: Prepare output for GitHub Pages
        run: |
          touch out/.nojekyll
          # Redirect root to /psyboss/ for clean URLs
          echo '<meta http-equiv="refresh" content="0; url=/psyboss/">' > out/index.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
